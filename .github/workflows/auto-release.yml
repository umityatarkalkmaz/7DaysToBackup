name: Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'memory-bank/**'
      - '.gitignore'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'agent.md'
      - 'metadata.yml'
      - 'file_version_info.txt'
      # NOTE: '**.txt' with a '!requirements.txt' exception used to live here.
      # Negation is not honoured inside paths-ignore, so '**.txt' also matched
      # requirements.txt and a dependency bump silently produced no release.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest ruff

    - name: Lint
      run: ruff check .

    - name: Test
      run: pytest -q

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller 7DaysToBackup.py -F -w -n 7DaysToBackup

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 7DaysToBackup-${{ matrix.os }}
        path: |
          dist/7DaysToBackup*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release Tag
      id: tag
      run: |
        echo "TAG_NAME=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Release ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
        files: |
          artifacts/7DaysToBackup-windows-latest/7DaysToBackup.exe
          artifacts/7DaysToBackup-macos-latest/7DaysToBackup
          artifacts/7DaysToBackup-ubuntu-latest/7DaysToBackup
