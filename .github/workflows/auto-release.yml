name: Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'metadata.yml'
      - 'file_version_info.txt'
      # NOTE: '**.txt' with a '!requirements.txt' exception used to live here.
      # Negation is not honoured inside paths-ignore, so '**.txt' also matched
      # requirements.txt and a dependency bump silently produced no release.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # Pinned: an unpinned linter fails builds on rule changes in a new
        # release, with no code change. Rules live in pyproject.toml.
        pip install "pytest==9.1.1" "ruff==0.16.2"

    - name: Lint
      run: ruff check .

    - name: Test
      run: pytest -q

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `asset` is what PyInstaller produces; `release_name` is what it is
        # published as. They differ because macOS and Linux both build a file
        # literally named `7DaysToBackup`, and GitHub release asset names must
        # be unique - so one silently replaced the other and Linux users got no
        # binary at all. Platform-suffixed names also tell a downloader which
        # build they are getting.
        #
        # Every asset is compressed. Linux and macOS have to be: release assets
        # are plain blobs, GitHub does not carry file modes, so a bare Unix
        # binary arrives without its executable bit - and with no extension
        # either, macOS Finder takes it for a text document and opens it in
        # TextEdit. tar records the mode, so extracting restores it. Windows
        # gets a zip, which Explorer opens on a double-click; PyInstaller
        # one-file bundles compress well, so the download shrinks either way.
        #
        # macOS ships the .app bundle PyInstaller already builds under -w,
        # rather than the bare binary next to it. Double-clicking it launches
        # the program instead of opening a Terminal window, and --icon only
        # reaches the bundle - the bare binary could never carry one.
        include:
          - os: ubuntu-latest
            asset: 7DaysToBackup
            binary_name: 7DaysToBackup
            release_name: 7DaysToBackup-linux.tar.gz
          - os: windows-latest
            asset: 7DaysToBackup.exe
            binary_name: 7DaysToBackup.exe
            release_name: 7DaysToBackup-windows.zip
          - os: macos-latest
            asset: 7DaysToBackup.app
            binary_name: 7DaysToBackup
            release_name: 7DaysToBackup-macos.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build the macOS icon
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # iconutil wants an .iconset of exactly these names. Each size is
        # rendered from assets/icon.svg rather than downscaled from one bitmap,
        # so the small ones stay crisp.
        ICONSET=assets/AppIcon.iconset
        mkdir -p "$ICONSET"
        cp assets/icon-16.png   "$ICONSET/icon_16x16.png"
        cp assets/icon-32.png   "$ICONSET/icon_16x16@2x.png"
        cp assets/icon-32.png   "$ICONSET/icon_32x32.png"
        cp assets/icon-64.png   "$ICONSET/icon_32x32@2x.png"
        cp assets/icon-128.png  "$ICONSET/icon_128x128.png"
        cp assets/icon-256.png  "$ICONSET/icon_128x128@2x.png"
        cp assets/icon-256.png  "$ICONSET/icon_256x256.png"
        cp assets/icon-512.png  "$ICONSET/icon_256x256@2x.png"
        cp assets/icon-512.png  "$ICONSET/icon_512x512.png"
        cp assets/icon-1024.png "$ICONSET/icon_512x512@2x.png"
        iconutil -c icns "$ICONSET" -o assets/AppIcon.icns

    - name: Build with PyInstaller
      shell: bash
      run: |
        set -euo pipefail
        # Built as an array so the empty-icon case on Linux never expands an
        # empty array - `set -u` treats that as an error under bash 3.2, which
        # is what /bin/bash still is on macOS.
        ARGS=(7DaysToBackup.py -F -w -n 7DaysToBackup)
        case "${{ runner.os }}" in
          Windows) ARGS+=(--icon assets/icon.ico);    SEP=";" ;;
          macOS)   ARGS+=(--icon assets/AppIcon.icns); SEP=":" ;;
          *)                                           SEP=":" ;;
        esac
        # Only the sizes the running application asks for; 512 and 1024 exist
        # for the .icns and would be dead weight inside the bundle.
        for size in 16 32 64 128 256; do
          ARGS+=(--add-data "assets/icon-$size.png${SEP}assets")
        done
        pyinstaller "${ARGS[@]}"

    - name: Stage release asset
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p out stage
        if [ "${{ runner.os }}" = "macOS" ]; then
          # Apple Silicon refuses to run unsigned code at all, and PyInstaller
          # leaves the bundle unsigned. ditto rather than zip: it is the
          # platform's own tool and carries bundle permissions correctly.
          codesign --force --sign - "dist/${{ matrix.asset }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ matrix.asset }}" "out/${{ matrix.release_name }}"
          exit 0
        fi
        cp "dist/${{ matrix.asset }}" "stage/${{ matrix.binary_name }}"
        if [ "${{ runner.os }}" = "Windows" ]; then
          # 7-Zip ships with the runner. Invoked from inside `stage` so the
          # entry lands at the archive root: given a path argument it would
          # store `stage/...` and the user would extract a folder.
          (cd stage && 7z a -tzip "../out/${{ matrix.release_name }}" "${{ matrix.binary_name }}")
        else
          # PyInstaller already marks it executable; setting it explicitly means
          # the tarball is correct even if that ever stops being true.
          chmod +x "stage/${{ matrix.binary_name }}"
          tar -czf "out/${{ matrix.release_name }}" -C stage "${{ matrix.binary_name }}"
        fi

    # Guards failures that are silent at build time and only surface on a
    # user's machine: a binary that will not start, or an archive that extracts
    # a folder instead of a program.
    - name: Verify the archive
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ runner.os }}" = "macOS" ]; then
          # Unpack what the user will actually download, not the staging copy.
          rm -rf check && mkdir check
          ditto -x -k "out/${{ matrix.release_name }}" check
          APP="check/${{ matrix.asset }}"
          BIN="$APP/Contents/MacOS/${{ matrix.binary_name }}"
          test -d "$APP" || { echo "::error::bundle missing"; exit 1; }
          test -x "$BIN" || { echo "::error::bundle executable missing or not executable"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "::error::icon missing"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"
          plutil -lint "$APP/Contents/Info.plist"
        elif [ "${{ runner.os }}" = "Windows" ]; then
          entries=$(7z l -ba "out/${{ matrix.release_name }}" | awk '{print $NF}')
          echo "entries: $entries"
          if [ "$entries" != "${{ matrix.binary_name }}" ]; then
            echo "::error::expected exactly '${{ matrix.binary_name }}' at the archive root, got: $entries"
            exit 1
          fi
        else
          mode=$(tar -tvzf "out/${{ matrix.release_name }}" | awk 'NR==1 {print $1}')
          echo "mode: $mode"
          case "$mode" in
            *x*) ;;
            *) echo "::error::archived binary is not executable ($mode)"; exit 1 ;;
          esac
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 7DaysToBackup-${{ matrix.os }}
        path: out/${{ matrix.release_name }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Compute release tag
      id: tag
      run: |
        echo "TAG_NAME=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Show what will be released
      run: find artifacts -type f -printf '%s\t%p\n' | sort -rn

    - name: Check every platform produced a distinct asset
      run: |
        total=$(find artifacts -type f | wc -l)
        unique=$(find artifacts -type f -printf '%f\n' | sort -u | wc -l)
        echo "$total file(s), $unique distinct name(s)"
        if [ "$total" -ne 3 ] || [ "$unique" -ne 3 ]; then
          echo "::error::Expected 3 files with 3 distinct names; duplicate names are"
          echo "::error::silently dropped when uploaded as release assets."
          find artifacts -type f -printf '%f\n' | sort | uniq -d
          exit 1
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Release ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
        # Fail loudly naming the missing file, rather than publishing an empty
        # release, if an artifact path ever drifts again.
        # Note: fail_on_unmatched_files does not protect against two matched
        # files sharing an asset name - that collision is silent, which is how
        # the Linux binary went missing from v2026.08.12-5c78664.
        fail_on_unmatched_files: true
        files: |
          artifacts/7DaysToBackup-windows-latest/7DaysToBackup-windows.zip
          artifacts/7DaysToBackup-macos-latest/7DaysToBackup-macos.zip
          artifacts/7DaysToBackup-ubuntu-latest/7DaysToBackup-linux.tar.gz
