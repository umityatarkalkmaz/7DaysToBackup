name: Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'memory-bank/**'
      - '.gitignore'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'agent.md'
      - 'metadata.yml'
      - 'file_version_info.txt'
      # NOTE: '**.txt' with a '!requirements.txt' exception used to live here.
      # Negation is not honoured inside paths-ignore, so '**.txt' also matched
      # requirements.txt and a dependency bump silently produced no release.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # Pinned: an unpinned linter fails builds on rule changes in a new
        # release, with no code change. Rules live in pyproject.toml.
        pip install "pytest==9.1.1" "ruff==0.16.2"

    - name: Lint
      run: ruff check .

    - name: Test
      run: pytest -q

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The asset name is carried here so each artifact holds exactly one
        # known file. `dist/7DaysToBackup*` also matched the macOS .app bundle,
        # which made the paths the release job expects non-deterministic.
        include:
          - os: ubuntu-latest
            asset: 7DaysToBackup
          - os: windows-latest
            asset: 7DaysToBackup.exe
          - os: macos-latest
            asset: 7DaysToBackup

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller 7DaysToBackup.py -F -w -n 7DaysToBackup

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 7DaysToBackup-${{ matrix.os }}
        path: dist/${{ matrix.asset }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Compute release tag
      id: tag
      run: |
        echo "TAG_NAME=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Show what will be released
      run: find artifacts -type f -printf '%s\t%p\n' | sort -rn

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Release ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
        # Fail loudly naming the missing file, rather than publishing an empty
        # release, if an artifact path ever drifts again.
        fail_on_unmatched_files: true
        files: |
          artifacts/7DaysToBackup-windows-latest/7DaysToBackup.exe
          artifacts/7DaysToBackup-macos-latest/7DaysToBackup
          artifacts/7DaysToBackup-ubuntu-latest/7DaysToBackup
